{{template "header"}}
    <h1>Les jeux</h1>

    <form method="get" action="/jeux">
        <input type="search" name="q" value="{{.Query}}" placeholder="Nom du jeu">
        <select name="genre">
            <option value="">Tous les genres</option>
            {{range .Genres}}
            <option value="{{.}}" {{if eq . $.Genre}}selected{{end}}>{{.}}</option>
            {{end}}
        </select>
        <button type="submit">Filtrer</button>
    </form>

    {{if .Query}}
    <p>Vous avez cherché : {{.Query}}</p>
    {{end}}

    <ul>
        {{range .Games}}
        <li><a href="/jeux/{{.ID}}">{{.Name}}</a></li>
        {{else}}
        <li>Aucun jeu trouvé</li>
        {{end}}
    </ul>
{{template "footer"}}
